<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ジャッジメントダイス</title>
  <meta name="description" content="Ebitengine で実装したサイコロゲーム。3 つのモードを収録。">

  <!-- OGP (Open Graph Protocol) -->
  <meta property="og:title" content="ジャッジメントダイス">
  <meta property="og:description" content="Ebitengine で実装したサイコロゲーム。3 つのモードを収録。">
  <meta property="og:type" content="website">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="ジャッジメントダイス">
  <meta name="twitter:description" content="Ebitengine で実装したサイコロゲーム。3 つのモードを収録。">
  <style>
    /* The game lays out at a fixed 640x480; let Ebitengine scale its canvas
       to fill the body and cap the body at that aspect ratio so the canvas
       never stretches. */
    html {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      overflow: hidden;
    }
    body {
      margin: 0;
      width: min(640px, 100vw, 133.33vh);
      aspect-ratio: 4 / 3;
      /* Ebitengine sets height:100% inline on the body; !important wins. */
      height: auto !important;
    }
    canvas { display: block; }
    .back {
      position: fixed;
      top: 12px;
      left: 12px;
      font: 14px system-ui, sans-serif;
      color: #888;
      text-decoration: none;
    }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <a class="back" href="../">← Games</a>
  <script src="../wasm_exec.js"></script>
  <script>
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("game.wasm"), go.importObject).then(result => {
      go.run(result.instance);
    });
  </script>
</body>
</html>
