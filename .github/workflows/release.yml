name: Tag releases

on:
  push:
    branches: [main]
    # A version number here only means something to code that imports this
    # repository, and dinosaur/ is the only part anyone can import. Editing a
    # README, a workflow or a game's web page changes nothing for them, so
    # opening a release PR for it is noise. An allow list rather than an
    # ignore list: files added later default to not releasing.
    #
    # tagpr's own release PR edits dinosaur/game/version.go, so merging it
    # still lands here and gets the tag pushed.
    paths:
      - 'dinosaur/**'
      - '.tagpr'

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # issues: read is for the bump labels.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # tagpr supplies its own token.
          persist-credentials: false
          # tagpr unshallows anyway.
          fetch-depth: 0

      - uses: Songmu/tagpr@d1b8138b7a31075141b6cd64103de9485ced7ac9 # v1.20.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
