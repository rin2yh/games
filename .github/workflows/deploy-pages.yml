name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Deny by default; each job opts into only what it needs.
permissions: {}

# Let an in-flight deployment finish; queue the next one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Only the checkout needs the token; the artifact upload uses the
    # runner's own credentials.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing after this step talks to GitHub; don't leave the token
          # in .git/config.
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Same as `mise run build-web`: every game becomes web/<name>/game.wasm
      # next to the index.html already committed there, so the whole web/
      # tree is the site.
      - name: Build every game into web/
        run: |
          for g in dinosaur-game gopher-run judgement-dice; do
            GOOS=js GOARCH=wasm go build -o "web/$g/game.wasm" "./cmd/$g"
          done
          # install rather than cp: the copy in GOROOT is read-only, and cp
          # would carry that over to the published file.
          install -m 644 "$(go env GOROOT)/lib/wasm/wasm_exec.js" web/wasm_exec.js

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # No checkout here: the deployment only needs to publish and to prove
    # its origin via OIDC.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
